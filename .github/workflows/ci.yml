name: Prüfung – Linux, Python und echte Medien
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testsystem mit FFmpeg versorgen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: FFmpeg und FFprobe prüfen
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Python-Code prüfen
        run: python3 -m compileall -q videozoom tests
      - name: Tk-Freiheit sicherstellen
        run: |
          if grep -R -n -E '(^|[[:space:]])(import tkinter|from tkinter)' videozoom; then
            echo 'Tk ist nicht erlaubt.'
            exit 1
          fi
      - name: Testdaten erzeugen
        run: python3 tests/fixtures/generieren.py
      - name: Alle Funktions- und Medienprüfungen
        run: python3 scripts/regression.py --all --bericht "$RUNNER_TEMP/provoware_regression.json"
      - name: Startdiagnose
        run: |
          python3 - <<'PYCODE'
          import json, subprocess
          p = subprocess.run(["bash", "STARTEN.sh", "--doctor"], capture_output=True, text=True, timeout=60)
          report = json.loads(p.stdout)
          assert isinstance(report.get("startbereit"), bool), report
          assert p.returncode == (0 if report["startbereit"] else 1), (p.returncode, report)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          print("Diagnosevertrag geprüft; Zielsystem-Startbereitschaft:", report["startbereit"])
          PYCODE
      - name: Browser-Zeitbudgets und Abfragefolge pruefen
        run: python3 scripts/browser_contract_check.py
      - name: Browser-Layout ohne Nutzerdaten pruefen
        run: python3 scripts/layout_check.py --ziel "$RUNNER_TEMP/videozoom-layout"
      - name: Screenshot- und Messbelege sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videozoom-layout-nachweise
          path: ${{ runner.temp }}/videozoom-layout/
          if-no-files-found: warn
          retention-days: 14
